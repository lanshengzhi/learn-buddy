<!doctype html>
<!--
  PROTOTYPE · 窄屏 IA — 一次性产物，不要合进产品路径。

  问题（wayfinder #41「窄屏 IA 原型」）：
    规格 §4.2 是唯一标着「未经验证」的地方，而它恰恰是家里人最常用的形状。
    它给的是纸面结构（抽屉 / D3 全屏覆盖层 / 单栏 / 底部词卡），**没人点过**。

  三个结构上不同的窄屏导航，用 ?variant=N1|N2|N3 切换：
    N1 汉堡 + 抽屉        —— 规格的字面：一个抽屉装下全部（面 + 记录 + 身份）
    N2 底部标签 + 抽屉    —— 面用底部 tab；记录与身份仍在抽屉里
    N3 无抽屉             —— 面用底部 tab；身份在右上头像；记录各自留在面内

  其余（D3 全屏覆盖层 / 底部词卡 / 选中工具条 / 阅读 / 书架 / Chat）三变体共用。

  要回答的五问（票 #41）：
    1 抽屉与 D3 覆盖层能同时打开吗？先开谁、怎么退？
    2 D3 一开一关，阅读位置会不会丢？
    3 底部词卡会不会挡住它要解释的那个词？
    4 写想法时虚拟键盘弹起，工具条该去哪？   ← 点顶栏「⌨ 键盘」模拟
    5 ~900px 断点够不够？                    ← 顶栏实时显示宽度与命中哪一套

  怎么跑：python3 server/tts_server.py --port 8000
          http://localhost:8000/prototype-narrow.html    （建议用 390×844 与 834×1112 两个尺寸看）

  真的：正文 / 分词 / ruby 来自 server/data/books/ 已解析章节；中文拼音与释义来自 server/data/dicts/zh.sqlite（CC-CEDICT）。
  假的：AI 回答、会话记录、持久化。没有网络请求。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE 窄屏 · 家庭中枢</title>
<style>
  :root{
    --bg:#f4f3ef; --surface:#fff; --text:#1f2328; --muted:#6a737d; --border:#dcd9d3;
    --primary:#2f6f4f; --primary-strong:#24563e; --soft:#e4efe8; --mark:#f6e7a8;
    --shadow:0 8px 30px rgba(0,0,0,.18); --tabh:54px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#16181b; --surface:#202327; --text:#e8e6e3; --muted:#9aa0a6; --border:#3a3f45;
    --primary:#5aa37e; --primary-strong:#6fb692; --soft:#23382c; --mark:#5c5220;}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{background:var(--bg);color:var(--text);overflow:hidden;
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans CJK SC",sans-serif;
    -webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  .app{display:flex;flex-direction:column;height:100dvh}

  /* 顶栏 */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px;
    padding-top:max(8px,env(safe-area-inset-top));background:var(--surface);
    border-bottom:1px solid var(--border);min-height:50px}
  .top .ic{all:unset;cursor:pointer;min-width:40px;min-height:40px;display:grid;place-items:center;
    border-radius:10px;font-size:18px}
  .top .ic:active{background:rgba(127,127,127,.18)}
  .top .title{flex:1;min-width:0;text-align:center;font-size:14px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .title small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
  .top .avatar{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:var(--primary);
    color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

  /* 主区 */
  .main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  .pane{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* 正文 */
  .rd{padding:16px 18px calc(var(--tabh) + 40px)}
  .rd h1{font-size:17px;line-height:1.45;margin:0 0 3px}
  .rd .meta{font-size:11.5px;color:var(--muted);margin-bottom:16px}
  .body{font-size:17px;line-height:2.05}
  .s{display:block;padding:3px 2px;border-radius:5px}
  .s.marked{background:var(--mark)}
  .w{border-radius:3px}
  ruby rt{font-size:.5em;color:var(--muted);font-weight:400}
  .note{margin:6px 0 12px;padding:7px 10px;border-left:3px solid var(--primary);
    background:var(--surface);border-radius:0 7px 7px 0;font-size:13px;color:var(--muted)}

  /* 书架 */
  .shelf{padding:16px 16px calc(var(--tabh) + 40px)}
  .shelf h2{margin:0 0 3px;font-size:18px}
  .shelf .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{all:unset;cursor:pointer;flex:0 0 auto;padding:6px 13px;border-radius:999px;font-size:13px;
    border:1px solid var(--border);background:var(--surface);color:var(--muted)}
  .cats button[aria-current="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
  .bk .cv{aspect-ratio:3/4.3;border-radius:7px;display:flex;align-items:flex-end;padding:8px;
    color:#fff;font-size:11px;font-weight:700;line-height:1.3;overflow:hidden;
    background:linear-gradient(150deg,#2f6f4f,#1d4632)}
  .bk:nth-child(3n) .cv{background:linear-gradient(150deg,#7a5a2e,#4a3618)}
  .bk:nth-child(3n+1) .cv{background:linear-gradient(150deg,#3a4a7a,#222c4a)}
  .bk .tt{font-size:12px;font-weight:600;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bk .pg{font-size:10.5px;color:var(--primary-strong)}
  .import{aspect-ratio:3/4.3;border:1.5px dashed var(--border);border-radius:7px;display:grid;
    place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}

  /* Chat */
  .chat{padding:12px 16px calc(var(--tabh) + 40px)}
  .recs{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
  .recs .r{padding:9px 10px;border-radius:9px;font-size:13.5px;background:var(--surface);
    border:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recs .r[aria-current="true"]{background:var(--soft);border-color:var(--primary);font-weight:600}
  .turn{margin:12px 0}
  .turn .who{font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:3px}
  .turn .bub{font-size:15px;line-height:1.7}
  .turn.me .bub{background:var(--soft);padding:8px 11px;border-radius:11px}

  /* 底部标签（N2 / N3） */
  .tabs{flex:0 0 auto;height:var(--tabh);padding-bottom:env(safe-area-inset-bottom);
    display:flex;background:var(--surface);border-top:1px solid var(--border)}
  .tabs button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;font-size:10.5px;color:var(--muted)}
  .tabs button[aria-current="true"]{color:var(--primary-strong);font-weight:700}
  .tabs button .g{font-size:19px;line-height:1}

  /* 抽屉（N1 / N2） */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:60;opacity:0;pointer-events:none;
    transition:opacity .16s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:absolute;top:0;left:0;bottom:0;width:80%;max-width:320px;z-index:61;
    background:var(--bg);border-right:1px solid var(--border);transform:translateX(-102%);
    transition:transform .18s ease;display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 10px 10px}
  .drawer.on{transform:none}
  .drawer .brand{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--muted);padding:4px 10px 12px}
  .drawer .ni{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:11px 10px;
    border-radius:10px;font-size:15px;min-height:46px}
  .drawer .ni[aria-current="true"]{background:var(--soft);color:var(--primary-strong);font-weight:600}
  .drawer .caret{margin-left:auto;font-size:10px;opacity:.55;transition:transform .12s}
  .drawer .caret.down{transform:rotate(90deg)}
  .drawer .subs{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 30px}
  .drawer .subs .se{all:unset;cursor:pointer;padding:8px;border-radius:8px;font-size:13px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drawer .subs .se[aria-current="true"]{background:var(--soft);color:var(--primary-strong);font-weight:600}
  .drawer .sp{flex:1}
  .face{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;
    background:var(--surface);border:1px solid var(--border)}
  .face .dot{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;
    place-items:center;font-size:12px;font-weight:700}
  .face .who{font-weight:600;font-size:14px}
  .face .sub{display:block;font-size:10.5px;color:var(--muted)}

  /* 选中工具条 */
  .selbar{position:absolute;z-index:64;display:flex;gap:1px;background:#1b1e21;color:#fff;padding:3px;
    border-radius:10px;box-shadow:var(--shadow);max-width:calc(100% - 16px);overflow-x:auto}
  .selbar button{all:unset;cursor:pointer;padding:9px 12px;border-radius:7px;font-size:13px;white-space:nowrap;
    min-height:38px;display:flex;align-items:center}
  .selbar .hi{font-weight:700;color:#8ce0ae}

  /* 底部卡片（词卡 / 写想法 / 身份） */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:66;background:var(--surface);
    border-top:1px solid var(--border);border-radius:14px 14px 0 0;box-shadow:0 -8px 26px rgba(0,0,0,.2);
    max-height:62%;display:flex;flex-direction:column}
  .sheet .grab{width:36px;height:4px;border-radius:99px;background:var(--border);margin:7px auto 0}
  .sheet .in{padding:10px 16px calc(14px + env(safe-area-inset-bottom));overflow-y:auto}
  .sheet .hw{font-size:22px;font-weight:700}
  .sheet .py{font-size:14px;color:var(--primary-strong);margin-top:1px}
  .sheet .lb{font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin:11px 0 4px}
  .sheet .gl{font-size:14px;line-height:1.7}
  .sheet .gl ol{margin:0;padding-left:18px}
  .sheet .gl .en{color:var(--muted);font-size:12.5px}
  .sheet .foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center;gap:10px}
  .sheet .foot .mk{font-size:13px;color:var(--muted)}
  .sheet .foot .ask{all:unset;cursor:pointer;font-size:14px;font-weight:700;color:var(--primary-strong)}
  .askrow{display:flex;gap:8px;flex:1}
  .askrow input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border);background:var(--bg);color:var(--text)}
  .askrow button{all:unset;cursor:pointer;background:var(--primary);color:#fff;border-radius:10px;
    padding:10px 15px;font-size:14px;font-weight:600}

  /* D3 全屏覆盖层 */
  .d3{position:absolute;inset:0;z-index:80;background:var(--surface);display:flex;flex-direction:column}
  .d3 .hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;
    padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--border);min-height:50px}
  .d3 .hd .ic{all:unset;cursor:pointer;min-width:40px;min-height:40px;display:grid;place-items:center;
    border-radius:10px;font-size:19px}
  .d3 .hd b{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .d3 .log{flex:1;min-height:0;overflow-y:auto;padding:12px 16px}
  .chip{display:inline-block;font-size:11px;color:var(--primary-strong);background:var(--soft);
    border-radius:6px;padding:3px 8px;margin-bottom:9px}
  .quoted{border-left:3px solid var(--primary);background:var(--bg);border-radius:0 8px 8px 0;
    padding:9px 12px;font-size:14px;line-height:1.7;margin:2px 0 11px}
  .presets{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
  .presets button{all:unset;cursor:pointer;border:1px solid var(--border);background:var(--surface);
    border-radius:999px;padding:8px 14px;font-size:13px;color:var(--primary-strong);min-height:38px}
  .inp{flex:0 0 auto;display:flex;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border)}
  .inp input{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 13px;border-radius:11px;
    border:1px solid var(--border);background:var(--bg);color:var(--text)}
  .inp button{all:unset;cursor:pointer;background:var(--primary);color:#fff;border-radius:11px;
    padding:11px 17px;font-size:14px;font-weight:600}

  /* 模拟虚拟键盘 */
  .kb{position:absolute;left:0;right:0;bottom:0;height:38%;z-index:70;background:#cfd3d8;
    border-top:1px solid var(--border);display:grid;place-items:center;color:#4a4f55;font-size:12px}
  @media (prefers-color-scheme:dark){.kb{background:#2b2f33;color:#9aa0a6}}

  /* 标注（原型提示，不属于设计） */
  .hint{position:absolute;left:8px;right:8px;bottom:calc(var(--tabh) + 8px);z-index:50;
    background:rgba(27,30,33,.86);color:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;
    line-height:1.5;pointer-events:none}
  .hint b{color:#8ce0ae}
  #sw{position:fixed;left:50%;bottom:calc(var(--tabh) + 62px);transform:translateX(-50%);z-index:200;
    display:flex;align-items:center;gap:8px;background:#111;color:#fff;border-radius:999px;padding:5px 7px;
    box-shadow:0 6px 20px rgba(0,0,0,.4);font:12px/1 ui-monospace,monospace}
  #sw button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.16);font-size:13px}
  #sw .lbl{min-width:186px;text-align:center}
  #sw .lbl b{color:#8ce0ae}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top"></div>
  <div class="main" id="main"></div>
  <div id="tabs"></div>
</div>
<div id="sw">
  <button id="prev">‹</button><span class="lbl" id="lbl"></span><button id="next">›</button>
</div>

function sentHTML(s,i){

  return `<span class="s${S.marks[i]?' marked':''}" data-i="${i}">${h}</span>${n}`;

      <div class="askrow"><input id="notein" placeholder="记一句人话…" value="${esc(S.notes[S.note.i]||'')}">
        <button data-a="note-save">存</button></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:9px">
        ⌨ 键盘弹起时：<b>工具条收起</b>，输入框贴到键盘上方（点顶栏 ⌨ 模拟）</div>
    </div></div>`;
  }
  if(S.who){
    h+=`<div class="sheet"><div class="grab"></div><div class="in">
      <div class="lb" style="margin-top:6px">现在是谁</div>
      ${FACES.map((f,i)=>`<div class="recs"><div class="r" data-a="setface" data-i="${i}"
        aria-current="${S.face===i}">${f.n}${S.face===i?' ✓':''}</div></div>`).join('')}
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px">换的是整套：书 · 进度 · 词表 · 对话</div>
    </div></div>`;
  }
  return h;
}
function hintHTML(){
  const t={
    N1:'<b>N1 汉堡 + 抽屉</b>：点左上 ☰ 开抽屉。抽屉开着时 D3 打不开（先关抽屉）。',
    N2:'<b>N2 底部标签 + 抽屉</b>：底部切面；记录与「现在是谁」在抽屉里。',
    N3:'<b>N3 无抽屉</b>：底部切面；右上头像换身份；会话列表在 Chat 面顶部。'
  }[V];
  return `<div class="hint">${t}<br>点一个<b>词</b>出词卡 · 长按/点句尾出<b>工具条</b>（此处：点句子右侧留白）· 顶部 ⌨ 模拟键盘</div>`;
}

/* ---------- 渲染 ---------- */
function render(){
  document.getElementById('top').innerHTML=topHTML();
  const m=document.getElementById('main');
  // Q2 的教训：整体重建 innerHTML 会把 .pane 的 scrollTop 重置为 0。
  // 「D3 是覆盖层所以阅读面还在」只在**不重渲染**时成立——必须显式接住滚动位置。
  const prevPane=m.querySelector('.pane'); const keep=prevPane?prevPane.scrollTop:null;
  m.innerHTML = (S.surface==='chat'?chatHTML():(S.shelf?readHTML():readHTML()))
    + (V!=='N3'?drawerHTML():'')
    + d3HTML() + selbarHTML() + sheetsHTML()
    + (S.kb?`<div class="kb">虚拟键盘（原型模拟）</div>`:'')
    + hintHTML();
  const p=m.querySelector('.pane'); if(p&&keep!=null) p.scrollTop=keep;
  document.getElementById('tabs').innerHTML=tabsHTML();
  document.getElementById('lbl').innerHTML=`<b>${V}</b> (${VARI[V].n})`;
  wire();
}
function wire(){
  const m=document.getElementById('main');
  const on=(id,fn)=>{const e=document.getElementById(id); if(e) e.onclick=fn;};
  on('burger',()=>go(()=>{S.drawer=true; S.kb=false;}));
  on('backBtn',back);
  on('kbBtn',()=>go(()=>{S.kb=!S.kb; if(S.kb){S.selbar=null;} if(!S.kb)S.note=null;}));
  on('avatar',()=>go(()=>S.who=true));
  m.querySelectorAll('.w').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const i=+el.closest('.s').dataset.i, w=el.dataset.w, r=el.getBoundingClientRect();
    const mr=m.getBoundingClientRect();
    const d=dictFor(bd(S.book).lang,w), s=bd(S.book).sentences[i].t;
    go(()=>{S.dict={w,i,lang:bd(S.book).lang,py:d?d.py:null,gl:d?d.gl:null,
      inText:`在「${s.length>18?s.slice(0,18)+'…':s}」里，就是它字面上的用法。`};});
    // Q3：把词滚到卡片上方——不让卡片挡住它
    requestAnimationFrame(()=>{
      const card=m.querySelector('.sheet'); const h=card?card.getBoundingClientRect().height:0;
      const pane=m.querySelector('.pane'); if(!pane) return;
      const top=el.getBoundingClientRect().top-mr.top+pane.scrollTop;
      const want=top-(pane.clientHeight-h-24);
      if(want>pane.scrollTop) pane.scrollTop=want;
    });
  });
  m.querySelectorAll('.s').forEach(el=>el.onclick=e=>{
    if(e.target.closest('.w')) return;
    const i=+el.dataset.i, r=el.getBoundingClientRect(), mr=m.getBoundingClientRect();
    go(()=>{S.sel={i,text:bd(S.book).sentences[i].t};
      S.selbar={x:Math.max(8,Math.min(r.left-mr.left, mr.width-360)), y:Math.max(6,r.top-mr.top-52)};});
  });
  m.querySelectorAll('[data-a]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const a=el.dataset.a;
    if(a==='drawer-off') return go(()=>S.drawer=false);
    if(a==='surf') return go(()=>{S.surface=el.dataset.s; S.shelf=false; S.drawer=false;});
    if(a==='caret') return go(()=>{ if(el.dataset.k==='chat')S.chatOpen=!S.chatOpen; else S.readOpen=!S.readOpen; });
    if(a==='pick') return go(()=>{ if(el.dataset.kind==='sess'){S.sess=+el.dataset.i;S.surface='chat';}
                                  else {S.book=el.dataset.i?SHELF.filter(x=>x.p)[+el.dataset.i].k:S.book;}
                                  S.shelf=false; S.drawer=false; });
    if(a==='face') return go(()=>S.who=true);
    if(a==='setface') return go(()=>{S.face=+el.dataset.i; S.who=null;});
    if(a==='cat') return go(()=>S.cat=el.dataset.c);
    if(a==='open') return go(()=>{S.book=el.dataset.k; S.shelf=false;});
    if(a==='import') return alert('原型：导入 epub（真项目走现有 POST /books 上传路径）');
    if(a==='mark') return go(()=>{S.marks[S.sel.i]=!S.marks[S.sel.i]; S.selbar=null;});
    if(a==='note') return go(()=>{S.note={open:true,i:S.sel.i}; S.selbar=null; S.kb=true;});
    if(a==='note-save'){ const v=m.querySelector('#notein').value; return go(()=>{S.notes[S.note.i]=v;S.note=null;S.kb=false;}); }
    if(a==='askbook') return openD3(bd(S.book).book+' · '+bd(S.book).chapter,{quote:S.sel.text,presets:true});
    if(a==='askword') return openD3(S.dict.w+' · '+bd(S.book).chapter,
      {quote:`${S.dict.w} —— 出现在「${bd(S.book).sentences[S.dict.i].t.slice(0,22)}…」`,presets:true});
    if(a==='d3-close') return go(()=>S.d3=null);
    if(a==='preset'){ const p=el.dataset.p; return go(()=>{S.d3.turns=[{me:true,x:`${p}：「${S.sel?S.sel.text:''}」`},
      {x:`（原型：这里会是「${p}」的结果。）`}]; S.selbar=null;}); }
    if(a==='d3-send'){ const v=m.querySelector('#d3in').value; if(!v.trim())return;
      return go(()=>{S.d3.turns.push({me:true,x:v.trim()});S.d3.turns.push({x:'（原型：模型的回答。）'});}); }
    if(a==='copy') return;
    if(a==='known') return go(()=>S.dict=null);
    if(a==='noop') return;
  });
}
function openD3(ctx,o){ go(()=>{ S.d3={ctx,quote:o.quote||null,presets:!!o.presets,
  turns:o.presets?[]:[{x:'（原型：模型的回答。）'}]}; S.selbar=null; S.dict=null; S.drawer=false; }); }
/* 点句子右侧留白 = 选中那句（真项目里是拖选，见规格 §4.3 的选区长度分流） */
document.addEventListener('click',e=>{
  if(!e.target.closest('#main')) return;
  if(e.target.closest('.sheet,.d3,.selbar,.drawer,.scrim,.w,[data-a]')) return;
  if(S.d3||S.dict||S.note||S.who) return;
  shownav();
});
function shownav(){ S.selbar=null; S.sel=null; render(); }

const KS=Object.keys(VARI);
function setV(v){V=v;P.set('variant',v);history.replaceState(null,'','?'+P.toString());render();}
document.getElementById('prev').onclick=()=>setV(KS[(KS.indexOf(V)+KS.length-1)%KS.length]);
document.getElementById('next').onclick=()=>setV(KS[(KS.indexOf(V)+1)%KS.length]);
/* 只重渲染——滚动位置由 render() 自己实时接住，不再缓存（缓存过的偏移量会遮蔽实时值） */
window.addEventListener('resize',()=>render());
render();
</script>
</body>
</html>
